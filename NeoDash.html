<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Platformer Dash</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f15;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
        }

        canvas {
            background-color: #1a1a24;
            border: 4px solid #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), inset 0 0 20px rgba(0, 255, 255, 0.1);
            border-radius: 5px;
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .text-glow {
            text-shadow: 0 0 10px currentColor;
            font-weight: bold;
            font-size: 24px;
        }

        #score-display { color: #00ffff; }
        #high-score-display { color: #ff00ff; }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(15, 15, 21, 0.9);
            padding: 30px;
            border: 2px solid #ff0055;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.5);
            border-radius: 10px;
            display: none;
        }

        #game-over h1 {
            color: #ff0055;
            margin-top: 0;
            text-shadow: 0 0 15px #ff0055;
        }

        #controls {
            margin-top: 20px;
            color: #aaa;
            text-align: center;
            font-size: 14px;
        }
        
        kbd {
            background: #333;
            padding: 3px 8px;
            border-radius: 4px;
            color: #fff;
            border-bottom: 2px solid #111;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        <div id="ui-layer">
            <div id="score-display" class="text-glow">SCORE: 0</div>
            <div id="high-score-display" class="text-glow">HIGH: 0</div>
        </div>
        <div id="game-over">
            <h1>GAME OVER</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <p style="color: #aaa; font-size: 14px; margin-top: 20px;">Press <kbd>SPACE</kbd> or click to Restart</p>
        </div>
    </div>
    
    <div id="controls">
        Move: <kbd>A</kbd> / <kbd>D</kbd> or <kbd>←</kbd> / <kbd>→</kbd> &nbsp;&nbsp;|&nbsp;&nbsp;
        Jump: <kbd>W</kbd> or <kbd>↑</kbd> or <kbd>SPACE</kbd>
        <br><br>
        <em>Jump on top of the red enemies to destroy them and score points!</em>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score-display');
        const highScoreEl = document.getElementById('high-score-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreEl = document.getElementById('final-score');

        // Game State
        let score = 0;
        let highScore = 0; // Removed localStorage read
        let isGameOver = false;
        let frameCount = 0;
        highScoreEl.innerText = `HIGH: ${highScore}`;

        const groundY = 400;

        // Player Object
        const player = {
            x: 400,
            y: groundY - 40,
            width: 40,
            height: 40,
            vx: 0,
            vy: 0,
            speed: 1.5,
            friction: 0.8,
            jumpPower: -13,
            gravity: 0.6,
            grounded: true,
            color: '#00ffff'
        };

        // Arrays
        let enemies = [];
        let particles = [];

        // Input tracking
        const keys = { left: false, right: false, up: false };

        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
                keys.up = true;
                if (isGameOver) resetGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = false;
        });

        canvas.addEventListener('mousedown', () => {
            if (isGameOver) resetGame();
            else keys.up = true;
        });
        canvas.addEventListener('mouseup', () => keys.up = false);

        // Particle System for explosions
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.life = 1.0;
                this.decay = Math.random() * 0.05 + 0.02;
                this.color = color;
                this.size = Math.random() * 8 + 4;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1.0;
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        // Spawn Enemies
        function spawnEnemy() {
            const size = 40;
            // Spawn left or right side
            const fromLeft = Math.random() > 0.5;
            const x = fromLeft ? -size : canvas.width;
            
            // Speed increases slightly as score goes up
            const baseSpeed = 3 + (score / 500);
            const vx = fromLeft ? baseSpeed + Math.random()*2 : -(baseSpeed + Math.random()*2);

            enemies.push({
                x: x,
                y: groundY - size,
                width: size,
                height: size,
                vx: vx,
                color: '#ff0055'
            });
        }

        function resetGame() {
            score = 0;
            scoreEl.innerText = `SCORE: ${score}`;
            player.x = canvas.width / 2 - player.width / 2;
            player.y = groundY - player.height;
            player.vx = 0;
            player.vy = 0;
            enemies = [];
            particles = [];
            isGameOver = false;
            frameCount = 0;
            gameOverScreen.style.display = 'none';
            requestAnimationFrame(gameLoop);
        }

        function triggerGameOver() {
            isGameOver = true;
            createExplosion(player.x + player.width/2, player.y + player.height/2, player.color);
            if (score > highScore) {
                highScore = score;
                // Removed localStorage.setItem write
                highScoreEl.innerText = `HIGH: ${highScore}`;
            }
            finalScoreEl.innerText = score;
            gameOverScreen.style.display = 'block';
        }

        // Main Game Loop
        function gameLoop() {
            if (isGameOver) {
                // Keep drawing particles so explosion finishes
                draw();
                return;
            }

            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            frameCount++;

            // Player Horizontal Movement
            if (keys.left) player.vx -= player.speed;
            if (keys.right) player.vx += player.speed;
            player.vx *= player.friction;
            player.x += player.vx;

            // Screen boundaries
            if (player.x < 0) { player.x = 0; player.vx = 0; }
            if (player.x + player.width > canvas.width) { player.x = canvas.width - player.width; player.vx = 0; }

            // Player Jumping / Gravity
            player.vy += player.gravity;
            player.y += player.vy;

            // Ground Collision
            if (player.y + player.height >= groundY) {
                player.y = groundY - player.height;
                player.vy = 0;
                player.grounded = true;
            } else {
                player.grounded = false;
            }

            if (keys.up && player.grounded) {
                player.vy = player.jumpPower;
                player.grounded = false;
                
                // Jump particle dust
                createExplosion(player.x + player.width/2, player.y + player.height, '#fff');
            }

            // Enemy Management
            const spawnRate = Math.max(40, 100 - Math.floor(score / 50)); // Gets faster over time
            if (frameCount % spawnRate === 0) spawnEnemy();

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.x += e.vx;

                // Collision Detection
                if (player.x < e.x + e.width &&
                    player.x + player.width > e.x &&
                    player.y < e.y + e.height &&
                    player.y + player.height > e.y) {
                    
                    // Check if player landed on TOP of the enemy
                    let prevBottom = (player.y - player.vy) + player.height;
                    let safeMargin = Math.abs(e.vx) + player.gravity + 5;

                    if (player.vy > 0 && prevBottom <= e.y + safeMargin) {
                        // Successful Stomp
                        score += 100;
                        scoreEl.innerText = `SCORE: ${score}`;
                        
                        // Bounce off the enemy
                        player.vy = player.jumpPower * 0.9;
                        
                        // Destroy enemy and create effect
                        createExplosion(e.x + e.width/2, e.y + e.height/2, e.color);
                        enemies.splice(i, 1);
                        continue;
                    } else {
                        // Hit from the side/bottom -> Game Over
                        triggerGameOver();
                    }
                }

                // Remove off-screen enemies
                if (e.x < -100 || e.x > canvas.width + 100) {
                    enemies.splice(i, 1);
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            // Clear canvas with trail effect
            ctx.fillStyle = 'rgba(26, 26, 36, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Ground line
            ctx.strokeStyle = '#333344';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();

            // Draw Grid (Geometry dash background aesthetic)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, groundY); ctx.stroke();
            }
            for(let i=0; i<groundY; i+=40) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // Draw Enemies
            for (let e of enemies) {
                ctx.fillStyle = e.color;
                ctx.shadowColor = e.color;
                ctx.shadowBlur = 15;
                ctx.fillRect(e.x, e.y, e.width, e.height);
                
                // Inner design
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 0;
                ctx.fillRect(e.x + 10, e.y + 10, e.width - 20, e.height - 20);
            }

            // Draw Player (Only if not game over)
            if (!isGameOver) {
                ctx.fillStyle = player.color;
                ctx.shadowColor = player.color;
                ctx.shadowBlur = 15;
                ctx.fillRect(player.x, player.y, player.width, player.height);
                
                // Eye / Inner design based on movement
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 0;
                let eyeOffset = (player.vx / player.speed) * 3;
                ctx.fillRect(player.x + 10 + eyeOffset, player.y + 10, 8, 8);
                ctx.fillRect(player.x + 22 + eyeOffset, player.y + 10, 8, 8);
            }

            // Draw Particles
            ctx.shadowBlur = 10;
            for (let p of particles) {
                ctx.shadowColor = p.color;
                p.draw(ctx);
            }
            ctx.shadowBlur = 0; // Reset
        }

        // Start
        resetGame();
    </script>
</body>
</html>
