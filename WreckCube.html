        const frontMaterial = new THREE.MeshStandardMaterial({ map: cupFaceTex, roughness: 0.6 });

          whiteMaterial,
          whiteMaterial,
          whiteMaterial,
          whiteMaterial,
          whiteMaterial,
          frontMaterial
        ];
        
        const cube = new THREE.Mesh(cubeGeometry, playerMaterials);
        cube.castShadow = true;
        cube.receiveShadow = true;
        scene.add(cube);
        
        // Create Physical Cube Body

            mass: 5,
            shape: cubeShape,
            position: new CANNON.Vec3(0, 10, 0),

            linearDamping: 0.4,   // Natural air resistance/friction for drifting forward/backward
            angularDamping: 0.6   // Helps bring the car out of a spin when you let go of steering
        });
        
        
        world.addBody(cubeBody);
        
        
        // --- SETUP PLATFORM FLOOR (WITH STATIC RIGID BODY) ---
        const floorGeometry = new THREE.PlaneGeometry(300, 300);
        const floor = new THREE.Mesh(floorGeometry, patchyMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);
        
        // Create Physical Floor Body
        const floorShape = new CANNON.Plane();
        const floorBody = new CANNON.Body({
            mass: 0,
            shape: floorShape,
            material: groundMaterial // <-- Added here
        });
        // Rotate the physical plane to align horizontally with the visible floor grid
        floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        world.addBody(floorBody);

        const keys = { w: false, a: false, s: false, d: false, space: false, shift: false }; // Added shift
        let lastDashTime = 0; // Tracks timestamp of the last dash
        const DASH_COOLDOWN = 7000; // 7 seconds in milliseconds
        
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = true;
            if (e.key === ' ') keys.space = true;
            if (e.key === 'Shift') keys.shift = true; // Track Shift
        });
        
        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = false;
            if (e.key === ' ') keys.space = false;
            if (e.key === 'Shift') keys.shift = false; // Track Release
        });

        // --- 4. ORBIT & MOUSE LOCK MECHANICS ---
        let radius = 10;
        let theta = 0;
        let phi = Math.PI / 3;

        const instructions = document.getElementById('instructions');

        window.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === document.body) {
                instructions.style.display = 'none';
            } else {
                instructions.style.display = 'block';
            }
        });

        window.addEventListener('mousemove', (event) => {
            if (document.pointerLockElement !== document.body) return;

            const sensitivity = 0.003;
            theta -= event.movementX * sensitivity;
            phi -= event.movementY * sensitivity;

            // Cap the angle so you can't go directly under the floor
            const minPhi = 0.1;
            const maxPhi = (Math.PI / 2) - 0.05;
            phi = Math.max(minPhi, Math.min(maxPhi, phi));
        });
        
        
        const physicsPairs = [];
        
        
        function makeBlock(xsize, ysize, zsize, x, y, z, xrot, yrot, zrot, b64texture) {
            let material;
            if (b64texture) {
                const tex = textureLoader.load(b64texture);
                material = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6 });
            } else {
                material = patchyMaterial;
            }
            const geometry = new THREE.BoxGeometry(xsize, ysize, zsize);
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.rotation.set(xrot, yrot, zrot);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            const shape = new CANNON.Box(new CANNON.Vec3(xsize / 2, ysize / 2, zsize / 2));
            const body = new CANNON.Body({
                mass: 0,
                shape: shape,
                position: new CANNON.Vec3(x, y, z),
                material: groundMaterial
            });
            const qX = new CANNON.Quaternion();
            const qY = new CANNON.Quaternion();
            const qZ = new CANNON.Quaternion();
            qX.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), xrot);
            qY.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), yrot);
            qZ.setFromAxisAngle(new CANNON.Vec3(0, 0, 1), zrot);
            
            body.quaternion = qX.mult(qY).mult(qZ);

            world.addBody(body);
            return { mesh, body };
        }
        
        
        
        
        
        function makeBox(xsize, ysize, zsize, x, y, z, xrot, yrot, zrot, b64texture) {
            let material;
            if (b64texture) {
                const tex = textureLoader.load(b64texture);
                material = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.5 });
            } else {
                material = whiteMaterial;
            }

            const geometry = new THREE.BoxGeometry(xsize, ysize, zsize);
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.rotation.set(xrot, yrot, zrot);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const massValue = (xsize * ysize * zsize) * 0.3;
            const shape = new CANNON.Box(new CANNON.Vec3(xsize / 2, ysize / 2, zsize / 2));
            const body = new CANNON.Body({
                mass: massValue,
                shape: shape,
                position: new CANNON.Vec3(x, y, z),
                material: slipperyMaterial,
                linearDamping: 0.1,
                angularDamping: 0.1
            });

            const qX = new CANNON.Quaternion();
            const qY = new CANNON.Quaternion();
            const qZ = new CANNON.Quaternion();
            qX.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), xrot);
            qY.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), yrot);
            qZ.setFromAxisAngle(new CANNON.Vec3(0, 0, 1), zrot);
            
            body.quaternion = qX.mult(qY).mult(qZ);

            world.addBody(body);

            physicsPairs.push({ mesh, body });

        function animate() {
          requestAnimationFrame(animate);

          world.step(1 / 60);

          let isGrounded = false;
          for (let i = 0; i < world.contacts.length; i++) {
              const contact = world.contacts[i];
              if (contact.bi === cubeBody || contact.bj === cubeBody) {
                  isGrounded = true;
                  break;
              }
          }
      
          
          
      
      
          // --- APPLY WASD FORCES ---
          const forceMagnitude = 150;
          const torqueMagnitude = 40;

          const forwardVector = new CANNON.Vec3(0, 0, -1);
          cubeBody.quaternion.vmult(forwardVector, forwardVector);
          if (keys.w) {
              const force = forwardVector.scale(forceMagnitude);
              cubeBody.applyForce(force, cubeBody.position);
          }
          if (keys.s) {
              const force = forwardVector.scale(-forceMagnitude);
              cubeBody.applyForce(force, cubeBody.position);
          }
 
          if (keys.space && isGrounded) {

              cubeBody.velocity.y = 20;
          }

          if (keys.a) {
              cubeBody.torque.y = torqueMagnitude;
          } else if (keys.d) {
              cubeBody.torque.y = -torqueMagnitude;
          } else {
              cubeBody.torque.y = 0;
          }
          
          // --- NEW: SHIFT DASH LOGIC ---
          const currentTime = performance.now(); // Get current game clock time
          const timeSinceLastDash = currentTime - lastDashTime;
      
          if (keys.shift && timeSinceLastDash >= DASH_COOLDOWN) {
              const dashSpeedBoost = 35;

              cubeBody.velocity.x += forwardVector.x * dashSpeedBoost;
              cubeBody.velocity.z += forwardVector.z * dashSpeedBoost;
              
              lastDashTime = currentTime;
          }
      
          // --- NEW: UPDATE COOLDOWN UI TEXT ---
          const dashStatusEl = document.getElementById('dashStatus');
          if (dashStatusEl) {
              if (timeSinceLastDash >= DASH_COOLDOWN) {
                  dashStatusEl.innerText = "Dash: READY (Shift)";
                  dashStatusEl.style.color = "#00ff00"; // Green text
              } else {
                  const timeLeft = ((DASH_COOLDOWN - timeSinceLastDash) / 1000).toFixed(1);
                  dashStatusEl.innerText = `Dash Cooldown: ${timeLeft}s`;
                  dashStatusEl.style.color = "#ff3333"; // Red text
              }
          }

          cubeBody.angularVelocity.x = 0;
          cubeBody.angularVelocity.z = 0;
          cubeBody.quaternion.x = 0;
          cubeBody.quaternion.z = 0;
          cubeBody.quaternion.normalize();
      
          cube.position.copy(cubeBody.position);
          cube.quaternion.copy(cubeBody.quaternion);
          
          for (let i = 0; i < physicsPairs.length; i++) {
                const item = physicsPairs[i];
                item.mesh.position.copy(item.body.position);
                item.mesh.quaternion.copy(item.body.quaternion);
            }
      
          camera.position.x = cube.position.x + radius * Math.sin(phi) * Math.sin(theta);
          camera.position.y = cube.position.y + radius * Math.cos(phi);
          camera.position.z = cube.position.z + radius * Math.sin(phi) * Math.cos(theta);
      
          camera.lookAt(cube.position);
      
          renderer.render(scene, camera);
      }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
